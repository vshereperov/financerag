[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "financerag"
version = "0.1.0"
description = "RAG over corporate financial documents"
requires-python = ">=3.13"
dependencies = [
    "fastembed==0.8.0",
    "httpx==0.28.1",
    "openai==2.41.1",
    "PyMuPDF==1.27.2.3",
    "pydantic-settings==2.14.2",
    "qdrant-client==1.18.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
